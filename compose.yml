name: ${COMPOSE_PROJECT_NAME:-r3-dev}
services:
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3180}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    image: ${BACKEND_IMAGE:-r3-backend:local}
    restart: unless-stopped
    environment: &backend-env
      APP_NAME: 3r
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Generate APP_KEY before starting}
      APP_URL: ${APP_URL:-http://localhost:3180}
      APP_TIMEZONE: Asia/Taipei
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: r3
      DB_USERNAME: r3
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SESSION_DRIVER: database
      SESSION_COOKIE: ${SESSION_COOKIE:-r3_dev_session}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SESSION_SAME_SITE: lax
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      MAIL_MAILER: log
      DEMO_SEED: ${DEMO_SEED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      OTP_DRIVER: ${OTP_DRIVER:-mock}
      OTP_TEST_PHONES: ${OTP_TEST_PHONES:-}
      MITAKE_USERNAME: ${MITAKE_USERNAME:-}
      MITAKE_PASSWORD: ${MITAKE_PASSWORD:-}
      DONATION_DRIVER: mock
      LINE_DRIVER: mock
      DRIVE_DRIVER: mock
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "php -r 'exit(@fsockopen(\"127.0.0.1\",9000)?0:1);'"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    image: ${FRONTEND_IMAGE:-r3-frontend:local}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_PUBLIC_API_BASE: /api/v1
      API_INTERNAL_URL: http://web/api/v1
      NUXT_API_INTERNAL_URL: http://web/api/v1
  worker:
    image: ${BACKEND_IMAGE:-r3-backend:local}
    restart: unless-stopped
    command: [php, artisan, queue:work, --sleep=3, --tries=3, --timeout=60]
    environment: *backend-env
    volumes:
      - storage:/app/storage
    depends_on:
      backend:
        condition: service_healthy
  scheduler:
    image: ${BACKEND_IMAGE:-r3-backend:local}
    restart: unless-stopped
    command: [php, artisan, schedule:work]
    environment: *backend-env
    volumes:
      - storage:/app/storage
    depends_on:
      backend:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: r3
      POSTGRES_USER: r3
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U r3 -d r3"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres:
  redis:
  storage:
